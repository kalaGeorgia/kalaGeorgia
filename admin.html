<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KALA Georgia — Админка</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500&display=swap">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div id="loginScreen" class="login-screen">
  <form class="login-card" id="loginForm">
    <div class="login-card__title">KALA Georgia</div>
    <p class="login-card__sub">Админ-панель сайта</p>
    <input type="password" id="passwordInput" placeholder="Пароль" autocomplete="current-password" required>
    <button type="submit" id="loginBtn">Войти</button>
    <p class="login-error" id="loginError"></p>
  </form>
</div>

<div id="editorScreen" class="editor-screen" hidden>
  <header class="editor-header">
    <div class="editor-header__brand">KALA Georgia — Админка</div>
    <div class="editor-header__actions">
      <a href="index.html" target="_blank" rel="noopener">Открыть сайт →</a>
      <button type="button" id="logoutBtn" class="btn-ghost">Выйти</button>
    </div>
  </header>

  <main class="editor-main">
    <p class="editor-loading" id="editorLoading">Загружаю контент…</p>

    <section class="editor-block" id="statsBlock" hidden>
      <h2>Статистика посещений</h2>
      <div class="stats-grid" id="statsGrid"></div>
    </section>

    <section class="editor-block" id="photosBlock" hidden>
      <h2>Фотографии</h2>
      <p class="editor-block__hint">Фото используются в слайдере блока «Автопарк». Слот 3 также служит фоном для главного экрана. Загружайте JPG/PNG — файл сожмётся автоматически.</p>
      <div class="photo-grid" id="photoGrid"></div>
    </section>

    <section class="editor-block" id="textsBlock" hidden>
      <h2>Тексты сайта</h2>
      <div class="lang-tabs" id="langTabs">
        <button type="button" data-lang="en" class="is-active">EN</button>
        <button type="button" data-lang="ka">KA</button>
        <button type="button" data-lang="ru">RU</button>
      </div>
      <div class="fields-wrap" id="fieldsWrap"></div>
    </section>
  </main>

  <div class="save-bar" id="saveBar" hidden>
    <span class="save-bar__status" id="saveStatus"></span>
    <button type="button" id="saveBtn">Сохранить изменения</button>
  </div>
</div>

<script src="js/admin.js"></script>
</body>
</html>
